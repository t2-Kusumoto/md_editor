name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. Build Linux Standalone Package (Ubuntu 22.04 LTS / glibc 2.35)
  # ----------------------------------------------------------------------------
  build-linux:
    name: Build Linux Package
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build standalone executable with build.py
        run: |
          python build.py

      - name: Package Linux Setup
        run: |
          cp dist/mded mded-linux-setup/mded
          chmod +x mded-linux-setup/mded mded-linux-setup/setup.sh mded-linux-setup/uninstall.sh
          tar -czvf "mded-${{ github.ref_name }}-linux-setup.tar.gz" mded-linux-setup

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: mded-linux-setup
          path: mded-${{ github.ref_name }}-linux-setup.tar.gz
          retention-days: 1

  # ----------------------------------------------------------------------------
  # 2. Build macOS Standalone Package
  # ----------------------------------------------------------------------------
  build-macos:
    name: Build macOS Package
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build standalone executable with build.py
        run: |
          python3 build.py

      - name: Package macOS Setup
        run: |
          cp dist/mded mded-mac-setup/mded
          rm -f mded-mac-setup/mded.placeholder
          chmod +x mded-mac-setup/mded mded-mac-setup/setup.sh mded-mac-setup/uninstall.sh mded-mac-setup/mded-launcher
          tar -czvf "mded-${{ github.ref_name }}-macos-setup.tar.gz" mded-mac-setup

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mded-mac-setup
          path: mded-${{ github.ref_name }}-macos-setup.tar.gz
          retention-days: 1

  # ----------------------------------------------------------------------------
  # 3. Build Windows Standalone Package & Inno Setup Installer
  # ----------------------------------------------------------------------------
  build-windows:
    name: Build Windows Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Build standalone executable with build.py
        run: |
          python build.py

      - name: Build Inno Setup Installer (setup_mded.exe)
        shell: powershell
        run: |
          Copy-Item dist\mded.exe -Destination mded_ins\mded.exe
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = (Get-Command iscc.exe).Source
          }
          & $iscc "/DMyAppVersion=${{ github.ref_name }}" mded_ins\setup.iss

      - name: Package Windows Setup ZIP
        shell: powershell
        run: |
          Copy-Item mded_ins\setup_mded.exe -Destination mded-win-setup\setup_mded.exe
          $zipName = "mded-${{ github.ref_name }}-windows-setup.zip"
          Compress-Archive -Path mded-win-setup -DestinationPath $zipName

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: mded-win-setup
          path: mded-${{ github.ref_name }}-windows-setup.zip
          retention-days: 1

  # ----------------------------------------------------------------------------
  # 4. Create GitHub Release and Upload All Packages
  # ----------------------------------------------------------------------------
  release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Release Notes Body
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO_NAME: ${{ github.repository }}
        run: |
          cat << EOF | sed 's/^ *//' > release_body.md
          ### 📥 ダウンロード (Downloads)

          | OS | パッケージ | 内容・形式 |
          | :--- | :--- | :--- |
          | 🪟 **Windows** | [mded-${TAG_NAME}-windows-setup.zip](https://github.com/${REPO_NAME}/releases/download/${TAG_NAME}/mded-${TAG_NAME}-windows-setup.zip) | インストーラ（\`setup_mded.exe\`）同梱 ZIP |
          | 🍎 **macOS** | [mded-${TAG_NAME}-macos-setup.tar.gz](https://github.com/${REPO_NAME}/releases/download/${TAG_NAME}/mded-${TAG_NAME}-macos-setup.tar.gz) | アプリ作成・セットアップスクリプト同梱 tar.gz |
          | 🐧 **Linux** | [mded-${TAG_NAME}-linux-setup.tar.gz](https://github.com/${REPO_NAME}/releases/download/${TAG_NAME}/mded-${TAG_NAME}-linux-setup.tar.gz) | デスクトップ登録・セットアップスクリプト同梱 tar.gz |

          ---
          EOF

      - name: Create GitHub Release and Attach Packages
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            release-artifacts/mded-${{ github.ref_name }}-linux-setup.tar.gz
            release-artifacts/mded-${{ github.ref_name }}-macos-setup.tar.gz
            release-artifacts/mded-${{ github.ref_name }}-windows-setup.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
